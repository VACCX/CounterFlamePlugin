      - name: Compile dylib
        run: |
          set -x
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "SDK=$SDK"
          xcrun --sdk iphoneos clang -dynamiclib -arch arm64 \
            -isysroot "$SDK" \
            -miphoneos-version-min=14.0 \
            -fobjc-arc -O2 -Wall \
            -framework UIKit -framework Foundation -framework QuartzCore \
            -framework CoreGraphics -framework CoreFoundation \
            -install_name @executable_path/CFPlugin.dylib \
            -o CFPlugin.dylib src/CFPlugin.m
          ls -lh CFPlugin.dylib
          xcrun --sdk iphoneos otool -hv CFPlugin.dylib || true
          xcrun --sdk iphoneos otool -L CFPlugin.dylib || true
      - name: Ad-hoc codesign dylib
        run: |
          set -x
          codesign --force --sign - --timestamp=none CFPlugin.dylib
          codesign -dvvv CFPlugin.dylib || true
          xcrun --sdk iphoneos otool -l CFPlugin.dylib | grep -A3 LC_CODE_SIGNATURE || true
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: CFPlugin-v23
          path: CFPlugin.dylib
          retention-days: 30
