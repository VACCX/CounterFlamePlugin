name: Build CFPlugin v6

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Write source
        run: |
          mkdir -p src
          cat > src/CFPlugin.m << 'EOF'
#import <UIKit/UIKit.h>
#import <Foundation/Foundation.h>
#import <QuartzCore/QuartzCore.h>
#include <dispatch/dispatch.h>
#include <unistd.h>

static UIView *g_overlay = nil;

@interface CFOverlay : UIView
@end
@implementation CFOverlay
- (instancetype)initWithFrame:(CGRect)f {
    self = [super initWithFrame:f];
    if (self) {
        self.backgroundColor = [UIColor clearColor];
        self.opaque = NO;
        self.userInteractionEnabled = NO;
    }
    return self;
}
- (void)drawRect:(CGRect)r {
    CGContextRef c = UIGraphicsGetCurrentContext();
    if (!c) return;
    NSString *txt = [NSString stringWithFormat:@"CF v6 | pid=%d", (int)getpid()];
    NSDictionary *attrs = @{
        NSFontAttributeName: [UIFont boldSystemFontOfSize:18],
        NSForegroundColorAttributeName: [UIColor greenColor]
    };
    [txt drawAtPoint:CGPointMake(25, 110) withAttributes:attrs];
}
@end

static void cf_attach(void) {
    if (g_overlay) return;
    UIWindow *win = nil;
#pragma clang diagnostic push
#pragma clang diagnostic ignored "-Wdeprecated-declarations"
    win = [UIApplication sharedApplication].keyWindow;
#pragma clang diagnostic pop
    if (!win) {
        for (UIWindow *w in [UIApplication sharedApplication].windows) {
            if (w.hidden == NO) { win = w; break; }
        }
    }
    if (!win) return;
    g_overlay = [[CFOverlay alloc] initWithFrame:win.bounds];
    g_overlay.autoresizingMask = UIViewAutoresizingFlexibleWidth | UIViewAutoresizingFlexibleHeight;
    [win addSubview:g_overlay];
    [win bringSubviewToFront:g_overlay];
    CADisplayLink *link = [CADisplayLink displayLinkWithTarget:g_overlay selector:@selector(setNeedsDisplay)];
    [link addToRunLoop:[NSRunLoop mainRunLoop] forMode:NSRunLoopCommonModes];
}

__attribute__((constructor))
static void cf_init(void) {
    dispatch_after(dispatch_time(DISPATCH_TIME_NOW, 3 * NSEC_PER_SEC),
                   dispatch_get_main_queue(), ^{
        for (int i = 0; i < 60 && !g_overlay; i++) {
            usleep(500000);
            dispatch_async(dispatch_get_main_queue(), ^{ cf_attach(); });
        }
    });
}
EOF
          echo "Source: $(wc -l < src/CFPlugin.m) lines"

      - name: Compile
        run: |
          set -x
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          xcrun --sdk iphoneos clang -dynamiclib -arch arm64 \
            -isysroot "$SDK" \
            -miphoneos-version-min=14.0 \
            -fobjc-arc -O2 \
            -framework UIKit -framework Foundation -framework QuartzCore \
            -install_name @executable_path/CFPlugin.dylib \
            -fmessage-length=0 \
            -o CFPlugin.dylib src/CFPlugin.m
          ls -lh CFPlugin.dylib
          xcrun --sdk iphoneos otool -hv CFPlugin.dylib || true
          xcrun --sdk iphoneos otool -L CFPlugin.dylib || true

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: CFPlugin-v6
          path: CFPlugin.dylib
          retention-days: 30
